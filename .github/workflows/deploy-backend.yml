name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/deploy-backend.yml]
  workflow_dispatch:

concurrency:
  group: huggingface
  cancel-in-progress: true

jobs:
  deploy:
    # Runs once the HF_SPACE variable and the HF_TOKEN secret are set
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Add the Space configuration
        working-directory: backend
        run: |
          cat > README.md <<'CARD'
          ---
          title: OkCupid Explorer API
          emoji: 💘
          colorFrom: pink
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          short_description: Flask API of the OkCupid Explorer (Project Eros)
          ---

          Backend of https://github.com/${{ github.repository }}, built from backend/Dockerfile.
          CARD
      - name: Upload the backend to the Space
        working-directory: backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          uvx --from huggingface_hub hf upload ${{ vars.HF_SPACE }} . .
          --repo-type space
          --exclude ".venv/*" --exclude "tests/*" --exclude "dev/*" --exclude "data/*"
          --exclude "pipeline/exploration/*" --exclude "*.ipynb"
          --delete "*"
          --commit-message "Deploy ${{ github.sha }}"
